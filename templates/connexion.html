<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Connexion PRESFOR CTB</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#edf3f6;color:#183a4a;padding:clamp(16px,5vw,48px)}
main{max-width:420px;margin:auto;background:white;padding:clamp(20px,5vw,32px);border-radius:16px;overflow-wrap:anywhere}
h1{font-size:1.6rem}label{display:block;margin-bottom:6px}input:not([type=hidden]){width:100%;min-width:0;min-height:44px;font:inherit;padding:10px;border:1px solid #bdcbd5;border-radius:8px}
button{min-height:44px;width:100%;border:0;border-radius:8px;background:#123a5e;color:white;font:inherit;padding:12px;cursor:pointer}
input:focus-visible,button:focus-visible{outline:3px solid #41a0c4;outline-offset:2px}.errorlist{color:#a52620;padding-left:20px}
</style></head><body><main><h1>PRESFOR CTB</h1><p>Connectez-vous pour accéder à la plateforme.</p><form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button type="submit">Se connecter</button></form></main></body></html>
